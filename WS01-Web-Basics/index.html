<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Personal Website</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
  <nav>
    <ul>
        <li><a href="#home">Home</a></li>
        <li><a href="#about">About</a></li>
        <li><a href="#contact">Contact</a></li>
    </ul>
</nav>

<section id="home">
    <h1>Welcome to My Website</h1>

    <h2>Learning Web Development</h2>

    <p>
        Hello! My name is Abishek.
        I am learning web development and this is my first personal webpage.
    </p>

    <img
        src="https://via.placeholder.com/300"
        alt="Placeholder image"
    >
</section>

<section id="about">
    <h2>About Me</h2>

    <p>
        I am learning HTML, CSS and web development.
        I enjoy learning new things and building websites.
    </p>
</section>

<section id="contact">
    <h2>Contact Me</h2>

    <form>
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required>

        <br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>

        <br><br>

        <label for="message">Message:</label>
        <br>
        <textarea id="message" name="message" rows="5" required></textarea>

        <br><br>

        <button type="submit">Send Message</button>
    </form>
</section>
</body>

</html>
